<body data-base="__ADMIN_BASE__">
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg></span>
      <span class="tt"><b>复盘运营台</b></span>
    </div>
    <nav class="nav">
      <div class="grp">监控</div>
      <a href="__ADMIN_BASE__/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>运营概览</a>
      <a href="__ADMIN_BASE__/tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>采集任务</a>
      <a href="__ADMIN_BASE__/sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>数据源</a>
      <a href="__ADMIN_BASE__/logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 16.5v.5"/><path d="M10.3 3.9L2.6 17.1A2 2 0 004.3 20h15.4a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0z"/></svg>运行日志</a>
      <div class="grp">系统</div>
      <a href="__ADMIN_BASE__/system" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.6 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 15H3a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009 3.6V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>调度与日历</a>

    <div class="side-foot">
      <div class="acct">
        <span class="av" id="userAv">—</span>
        <span class="acct-tx"><b id="userName">—</b><small>运营账号</small></span>
        <span class="on" title="服务在线"><i></i>在线</span>
      </div>
      <div class="foot-links">
        <a href="/" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1h5"/></svg>打开前台看板<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
        <a href="__ADMIN_BASE__/logout" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5M21 12H9"/><path d="M12 3H5a1 1 0 00-1 1v16a1 1 0 001 1h7"/></svg>退出登录</a>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1>调度与日历</h1>
      <span class="sub">定时任务 · 交易日历缓存</span>
      <span class="sp"></span>
      <span class="clock" id="clock">—</span>
      <button class="btn ghost" id="calBtn" onclick="refreshCalendar()">刷新交易日历</button>
      <button class="btn" onclick="loadSystem(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>刷新</button>
    </header>

    <div class="wrap">
      <section class="card">
        <div class="card-hd">
          <h2>调度器状态</h2>
        </div>
        <div class="card-bd" id="sysBody"><div class="skel" style="width:60%"></div></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script src="__ADMIN_BASE__/static/admin-common.js"></script>
<script>
async function loadSystem(manual){
  let s = null;
  try{ s = await api('/api/system'); }catch(e){}
  if(!s){
    q('#sysBody').innerHTML = '<div class="empty" style="padding:24px;text-align:center">状态加载失败，请点击右上角「刷新」重试</div>';
    return;
  }
  const cal = s.calendar || {};
  const stale = cal.stale;
  /* 与「数据源」页保持同一套中文任务名，避免同一任务在两处叫法不同 */
  const JOB_NAME = {full:'收盘全量采集', intraday:'盘中轻量刷新', calendar:'交易日历刷新'};
  const jobs = (s.jobs||[]).map(j=>`<tr><td>${esc(JOB_NAME[j.id]||j.id)}</td><td class="mono">${esc(String(j.next_run||'—').slice(0,19))}</td></tr>`).join('');
  q('#sysBody').innerHTML = `
    <div class="ribbon" style="margin:0 0 14px">
      <div class="rib">
        <span class="ic ${s.scheduler_running?'ok':'err'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.6"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg></span>
        <span class="tx"><span class="k">定时调度器</span><span class="v">${s.scheduler_running?'运行中':'未运行'}<small>${s.scheduler_running? 'ENABLE_SCHEDULER=1' : '检查 ENABLE_SCHEDULER'}</small></span></span>
      </div>
      <div class="rib">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></span>
        <span class="tx"><span class="k">收盘全量采集</span><span class="v">每交易日 ${s.full_collect_time||'15:30'}<small>全量字段写入</small></span></span>
      </div>
      <div class="rib">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 3v6h-6"/></svg></span>
        <span class="tx"><span class="k">盘中轻量轮询</span><span class="v">每 ${s.intraday_minutes||5} 分钟<small>交易时段增量刷新</small></span></span>
      </div>
    </div>
    <div class="sys-grid">
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin-bottom:8px">定时任务</div>
        <table class="tbl" style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
          <thead><tr><th>任务</th><th>下次运行</th></tr></thead>
          <tbody>${jobs || '<tr><td colspan="2" class="empty">无定时任务</td></tr>'}</tbody>
        </table>
      </div>
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin-bottom:8px">交易日历缓存</div>
        <div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);line-height:2">
          <div>状态 <span class="pill ${stale?'running':'ok'}">${stale?'需刷新':'有效'}</span></div>
          <div>覆盖至 <b class="mono">${cal.last_trade_date||'—'}</b></div>
          <div>最近更新 <b class="mono">${cal.refreshed_at? fmtDate(cal.refreshed_at):'—'}</b></div>
        </div>
      </div>
    </div>`;
  if(manual) toast('已刷新');
}
async function refreshCalendar(){
  const b=q('#calBtn'); b.disabled=true; b.textContent='刷新中…';
  try{ const r = await api('/api/calendar/refresh',{method:'POST'}); toast(r.msg||'已刷新', r.ok?'ok':'err'); await loadSystem(); }
  catch(e){ toast('刷新失败','err'); }
  finally{ b.disabled=false; b.textContent='刷新交易日历'; }
}

tickClock(); setInterval(tickClock, 1000);
loadMe();
loadSystem();
setInterval(loadSystem, 60000);
</script>
</body>
</html>
