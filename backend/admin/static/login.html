<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · A股复盘运营台</title>
<link rel="stylesheet" href="__ADMIN_BASE__/static/admin.css">
<style>
body{background:
  radial-gradient(900px 520px at 12% -8%, #E8F0FF 0%, rgba(232,240,255,0) 62%),
  radial-gradient(760px 480px at 96% 104%, #EEF8F2 0%, rgba(238,248,242,0) 60%),
  var(--bg)}
/* 用 flex 而不是 grid：grid 的 auto 轨道会按卡片 max-content(394px) 撑开，
   max-width:100% 于是按被撑大的轨道解析，390px 手机上卡片反而横向溢出。
   flex 下百分比 max-width 相对容器内容盒解析，卡片会正确收窄到可视区。 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lg-card{position:relative;width:394px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);padding:32px 30px 30px;overflow:hidden}
.lg-card::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brand) 0%,#60A5FA 55%,rgba(96,165,250,0) 100%)}
.lg-brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.lg-brand .mk{width:40px;height:40px;border-radius:11px;background:linear-gradient(140deg,#3B82F6,#1D4ED8);
  display:grid;place-items:center;box-shadow:0 8px 18px rgba(37,99,235,.32)}
.lg-brand .mk svg{width:21px;height:21px;color:#fff}
.lg-brand b{display:block;font-size:14.5px;font-weight:680;letter-spacing:.1px;line-height:1.3;color:var(--ink)}
.lg-brand span{display:block;font-size:10px;color:var(--ink-3);letter-spacing:.15em;text-transform:uppercase;font-weight:600}
.fld{margin-bottom:15px;position:relative}
.fld label{font-size:var(--t2);font-weight:600;color:var(--ink-2);display:block;margin-bottom:7px;letter-spacing:.02em}
.fld .inp-wrap{position:relative}
.fld input{width:100%;height:44px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);
  padding:0 13px 0 40px;font-size:var(--t4);color:var(--ink);outline:none;transition:.16s;font-family:var(--ff);
  font-variant-numeric:tabular-nums}
.fld input::placeholder{color:#9AA9BC}
.fld input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fld .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none;transition:.16s}
.fld input:focus + .ico{color:var(--brand)}
.caps-hint{display:none;color:var(--warn);font-size:var(--t2);font-weight:600;margin-top:6px}
.caps-hint.show{display:block}
.btn-lg{width:100%;height:44px;border:0;border-radius:var(--r);background:var(--brand);color:#fff;
  font-size:var(--t4);font-weight:650;cursor:pointer;transition:.16s;box-shadow:0 4px 14px rgba(37,99,235,.24);font-family:var(--ff);
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-lg:hover{background:var(--brand-2);box-shadow:0 6px 18px rgba(37,99,235,.3)}
.btn-lg:active{transform:translateY(.5px)}
.btn-lg:disabled{opacity:.65;cursor:not-allowed;box-shadow:none}
.btn-lg svg{width:16px;height:16px}
.msg{margin-top:13px;font-size:var(--t3);color:var(--danger);text-align:center;min-height:18px;font-weight:600}
@media(max-width:480px){.lg-card{padding:26px 20px 22px}}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M7 21l5-6 4 3 4-6 5 4' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="login">
  <form class="lg-card" id="f" novalidate>
    <div class="lg-brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg></span>
      <span><b>复盘运营台</b></span>
    </div>
    <div class="fld">
      <label for="uname">用户名</label>
      <div class="inp-wrap">
        <input type="text" id="uname" name="username" placeholder="请输入用户名" autocomplete="username" autofocus spellcheck="false">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
      </div>
    </div>
    <div class="fld">
      <label for="pwd">密码</label>
      <div class="inp-wrap">
        <input type="password" id="pwd" name="password" placeholder="请输入密码" autocomplete="current-password">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      </div>
      <div class="caps-hint" id="capsHint">Caps Lock 已开启</div>
    </div>
    <button class="btn-lg" type="submit" id="submitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg><span>登 录</span></button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>
</div>
<script>
const BASE = '__ADMIN_BASE__';
const $ = s => document.querySelector(s);
const uname = $('#uname'), pwd = $('#pwd'), msg = $('#msg'), btn = $('#submitBtn');

function setMsg(t){ msg.textContent = t || ''; }
function submitting(on){
  btn.disabled = on;
  btn.querySelector('span').textContent = on ? '登录中…' : '登 录';
}
// CapsLock 提示
function checkCaps(e){ $('#capsHint').classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock')); }
uname.addEventListener('keyup', checkCaps);
pwd.addEventListener('keyup', checkCaps);
pwd.addEventListener('keydown', checkCaps);

$('#f').addEventListener('submit', async e=>{
  e.preventDefault();
  setMsg('');
  const u = uname.value.trim(), p = pwd.value;
  if(!u){ setMsg('请输入用户名'); uname.focus(); return; }
  if(!p){ setMsg('请输入密码'); pwd.focus(); return; }
  submitting(true);
  try{
    const r = await fetch(BASE + '/login', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p)
    });
    if(r.ok){ location.href = BASE + '/'; return; }
    const d = await r.json().catch(()=>({}));
    setMsg(d.msg || '用户名或密码错误');
    if(r.status===429){ pwd.value=''; }
  }catch(err){
    setMsg('网络异常，请稍后再试');
  }finally{
    submitting(false);
  }
});
</script>
</body>
</html>
