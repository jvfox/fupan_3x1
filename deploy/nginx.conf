# Nginx 反向代理配置（面向公众部署）
# 放到 /etc/nginx/conf.d/ashare.conf，替换 your-domain.com 后 nginx -t && systemctl reload nginx
# 警告：不要在公网长期以纯 HTTP 运行。certbot 签发证书后必须启用下方 443 段并把 80 跳转 HTTPS。

server {
    listen 80;
    server_name your-domain.com;
    # 如需 HTTPS，用 certbot 签发后会自动改写本段，或参考下方 443 配置

    client_max_body_size 2m;

    # 兜底拒绝：即使后端挂载失效，也不让密钥/数据库/日志/备份被直接伺服。
    # 注意 /data/ 是公开看板数据，不在此拒绝之列。
    location ~* (^/\.env$|\.env$|\.db$|\.log$|\.sql(\.gz)?$|^/\.git/|^/backups?/) {
        deny all;
        return 404;
    }

    # ---------- 管理后台 /admin ----------
    # 可选：限制来源 IP（把 1.2.3.4 换成你的办公 IP；多人用多个 allow）
    # allow 1.2.3.4;
    # allow 10.0.0.0/8;
    # deny all;

    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 手动补采可能较慢
    }

    # ---------- 公开看板与数据 ----------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 数据文件可加缓存，减轻后端压力（采集间隔 1 分钟）
    location /data/ {
        proxy_pass http://127.0.0.1:8000/data/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=30";
    }
}

